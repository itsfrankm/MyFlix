<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyFlix</title>
    <link id="page-stylesheet" rel="stylesheet" href="css/profiles.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app-root"></div>

    <script type="module">
      import { initProfilesPage } from "./js/profiles.js";
      import { initCatalogPage } from "./js/catalogo.js";

      window.__MYFLIX_APP__ = true;

      const VIEWS = {
        profiles: {
          html: "pages/profiles.html",
          css: "css/profiles.css",
          init: initProfilesPage,
        },
        catalogo: {
          html: "pages/catalogo.html",
          css: "css/catalogo.css",
          init: initCatalogPage,
        },
      };

      const appRoot = document.getElementById("app-root");
      const pageStylesheet = document.getElementById("page-stylesheet");
      const htmlCache = new Map();
      let activeController = null;
      let currentView = null;

      function cleanupTransientUI() {
        document
          .querySelectorAll(
            ".profiles-dropdown, .movie-overlay, .welcome-toast, .profiles-modal-overlay",
          )
          .forEach((el) => el.remove());
      }

      function loadStylesheet(href) {
        return new Promise((resolve) => {
          const currentHref = pageStylesheet.getAttribute("href");
          if (currentHref === href && pageStylesheet.sheet) {
            resolve();
            return;
          }
          let done = false;
          const finish = () => {
            if (done) return;
            done = true;
            resolve();
          };
          pageStylesheet.addEventListener("load", finish, { once: true });
          pageStylesheet.addEventListener("error", finish, { once: true });
          if (currentHref !== href) {
            pageStylesheet.setAttribute("href", href);
          }
          setTimeout(finish, 400);
        });
      }

      async function fetchViewMarkup(url) {
        if (htmlCache.has(url)) return htmlCache.get(url);
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Falha ao carregar ${url}: ${res.status}`);
        const text = await res.text();
        const doc = new DOMParser().parseFromString(text, "text/html");
        doc.querySelectorAll("script").forEach((s) => s.remove());
        // Converte caminhos relativos de ../assets/ para assets/ ao montar na raiz
        doc.querySelectorAll("[src]").forEach((el) => {
          const src = el.getAttribute("src");
          if (src && src.startsWith("../assets/")) {
            el.setAttribute("src", src.slice(3));
          }
        });
        const markup = doc.body.innerHTML;
        htmlCache.set(url, markup);
        return markup;
      }

      async function renderView(viewName, { pushHistory = true } = {}) {
        const view = VIEWS[viewName] || VIEWS.profiles;
        const resolvedName = VIEWS[viewName] ? viewName : "profiles";

        if (activeController) {
          activeController.abort();
          activeController = null;
        }
        cleanupTransientUI();

        const [markup] = await Promise.all([
          fetchViewMarkup(view.html),
          loadStylesheet(view.css),
        ]);

        appRoot.innerHTML = markup;
        currentView = resolvedName;
        sessionStorage.setItem("myflix_view", resolvedName);

        if (pushHistory) {
          history.pushState(
            { view: resolvedName },
            "",
            window.location.pathname,
          );
        }

        activeController = new AbortController();
        view.init(activeController.signal);
        window.scrollTo(0, 0);
      }

      window.__MYFLIX_NAVIGATE__ = (viewName) =>
        renderView(viewName, { pushHistory: true });

      window.addEventListener("popstate", (e) => {
        const targetView =
          (e.state && e.state.view) ||
          sessionStorage.getItem("myflix_view") ||
          "profiles";
        if (targetView !== currentView) {
          renderView(targetView, { pushHistory: false });
        }
      });

      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light") {
        document.documentElement.classList.add("theme-light");
      }

      const initialView = sessionStorage.getItem("myflix_view") || "profiles";
      history.replaceState({ view: initialView }, "", window.location.pathname);
      renderView(initialView, { pushHistory: false });
    </script>
  </body>
</html>
